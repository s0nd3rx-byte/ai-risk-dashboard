<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 风险预警指数</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --danger: #f85149;
    --warn: #d2991d;
    --safe: #3fb950;
    --blue: #58a6ff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    min-height:100vh; display:flex; justify-content:center; padding:20px;
  }
  .dashboard { max-width:900px; width:100%; }
  h1 {
    text-align:center; font-size:1.6rem; margin-bottom:4px;
    background: linear-gradient(135deg, var(--blue), #a371f7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .timestamp { text-align:center; color:var(--muted); font-size:0.8rem; margin-bottom:24px; }

  /* ── 总分大圆盘 ── */
  .hero {
    text-align:center; margin-bottom:28px;
    padding:24px; background:var(--card); border:1px solid var(--border); border-radius:16px;
  }
  .gauge {
    display:inline-block; width:140px; height:140px; border-radius:50%;
    background: conic-gradient(
      var(--danger) 0deg, var(--danger) 72deg,
      var(--warn) 72deg, var(--warn) 234deg,
      var(--safe) 234deg, var(--safe) 306deg,
      #3fb950 306deg, #3fb950 360deg
    );
    position:relative;
  }
  .gauge::after {
    content:''; position:absolute; top:12px; left:12px;
    width:116px; height:116px; border-radius:50%; background:var(--card);
  }
  .gauge-val {
    position:relative; z-index:2; font-size:2.6rem; font-weight:800;
    margin-top:-100px;
  }
  .gauge-label { color:var(--muted); font-size:0.9rem; margin-top:4px; }
  .alert-badge {
    display:inline-block; margin-top:10px; padding:6px 18px;
    border-radius:20px; font-size:0.85rem; font-weight:600;
  }
  .alert-danger { background:rgba(248,81,73,0.15); color:var(--danger); }
  .alert-warning { background:rgba(210,153,29,0.15); color:var(--warn); }
  .alert-normal { background:rgba(88,166,255,0.12); color:var(--blue); }
  .alert-safe   { background:rgba(63,185,80,0.12); color:var(--safe); }

  /* ── 指标卡片 ── */
  .cards { display:flex; flex-direction:column; gap:12px; }
  .card {
    background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:16px 20px;
  }
  .card-header {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:8px;
  }
  .card-title { font-weight:600; }
  .card-weight { color:var(--muted); font-size:0.8rem; }

  .card-body { display:flex; align-items:center; gap:16px; }
  .bar-wrap { flex:1; }
  .bar-bg { height:8px; background:#21262d; border-radius:4px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:4px; transition:width 0.5s; }
  .bar-fill.danger { background:var(--danger); }
  .bar-fill.warn   { background:var(--warn); }
  .bar-fill.normal { background:var(--blue); }
  .bar-fill.safe   { background:var(--safe); }

  .score-cell { text-align:right; min-width:70px; }
  .score-num  { font-size:1.5rem; font-weight:700; }
  .score-change { font-size:0.75rem; display:flex; align-items:center; justify-content:flex-end; gap:2px; }
  .trend-up    { color:var(--danger); }
  .trend-down  { color:var(--safe); }
  .trend-flat  { color:var(--muted); }

  .raw-tag { font-size:0.7rem; color:var(--muted); margin-top:2px; text-align:right; }
.cape-reminder { font-size:0.65rem; color:var(--accent); margin-top:1px; text-align:right; opacity:0.8; }

  /* ── 折线图 ── */
  .sparkline-wrap { width:100px; height:36px; flex-shrink:0; }
  .sparkline-wrap svg { width:100%; height:100%; }
  .sparkline-wrap polyline {
    fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;
  }

  .footer { text-align:center; color:var(--muted); font-size:0.7rem; margin-top:32px; padding-bottom:20px; }

  @media(max-width:600px){
    .card-body { flex-wrap:wrap; }
    .sparkline-wrap { width:70px; height:28px; }
  }
</style>
</head>
<body>
<div class="dashboard">
  <h1>⚠️ AI 风险预警指数</h1>
  <div class="timestamp" id="timestamp">加载中…</div>

  <!-- 总分圆盘 -->
  <div class="hero">
    <div class="gauge"></div>
    <div class="gauge-val" id="totalScore">--</div>
    <div class="gauge-label">/ 100 · 综合风险</div>
    <div id="alertBadge"></div>
  </div>

  <!-- 指标卡片容器 -->
  <div class="cards" id="cards"></div>

  <div class="footer">
    数据来源: yfinance · Yale Shiller · 手动维护 &nbsp;|&nbsp; ⚠️ ≥80 触发减仓警戒
  </div>
</div>

<script>
// ════════════════════════════════════════════
//  内嵌数据 — dashboard.py 每次运行后自动覆盖
// ════════════════════════════════════════════
const DEMO_DATA = {"timestamp": "2026-08-03 21:17:13", "total_score": 65.5, "alert": "⚡ 中高风险 — 密切关注", "alert_level": "warning", "indicators": [{"name": "Mag7 capex/OCF", "score": 40, "weight": 0.25, "weighted": 10.0, "prev_score": 25, "history": [40, 25, 25, 40], "raw_value": "63.8% (Mag5: 87.2%)", "trend": "up"}, {"name": "HBM代理回撤", "score": 90, "weight": 0.25, "weighted": 22.5, "prev_score": 90, "history": [0, 60, 40, 0, 40, 60, 40, 60, 75, 60, 60, 75, 75, 75, 75, 75, 75, 75, 75, 90, 75, 75, 75, 90, 90, 90, 90, 100, 90, 90], "raw_value": "回撤 42.6%", "trend": "flat"}, {"name": "Kospi-Nasdaq相关性", "score": 90, "weight": 0.2, "weighted": 18.0, "prev_score": 100, "history": [60, 60, 60, 75, 75, 75, 75, 60, 60, 90, 90, 90, 100, 90, 75, 90, 90, 90, 90, 100, 100, 100, 100, 90, 100, 100, 100, 100, 90, 90], "raw_value": "相关性 0.424 (分位 93%)", "trend": "down"}, {"name": "AI股间相关性", "score": 25, "weight": 0.2, "weighted": 5.0, "prev_score": 25, "history": [25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25], "raw_value": "均值 0.234 (分位 4%)", "trend": "flat"}, {"name": "Shiller CAPE", "score": 100, "weight": 0.1, "weighted": 10.0, "prev_score": 100, "history": [100], "raw_value": "CAPE 41.29", "trend": "flat"}]};

// ════════════════════════════════════════════
//  初始化
// ════════════════════════════════════════════
(async function init() {
  let data = DEMO_DATA;

  // 尝试加载外部 JSON（开发时用）
  try {
    const res = await fetch('dashboard_data.json');
    if (res.ok) data = await res.json();
  } catch(e) { /* fallback to embedded */ }

  render(data);
})();

function render(data) {
  document.getElementById('timestamp').textContent = '运行时间: ' + data.timestamp;

  // 总分
  const ts = data.total_score;
  document.getElementById('totalScore').textContent = ts;

  // 圆盘指针
  const gauge = document.querySelector('.gauge');
  // 指针角度: 0分=180°(左), 100分=0°(右) → angle = (1 - score/100) * 180
  const pointerAngle = (1 - ts/100) * 180;
  gauge.style.background = `conic-gradient(
    var(--safe)   0deg, var(--safe)   ${0.15*360}deg,
    var(--blue)   ${0.15*360}deg, var(--blue)   ${0.40*360}deg,
    var(--warn)   ${0.40*360}deg, var(--warn)   ${0.65*360}deg,
    var(--danger) ${0.65*360}deg, var(--danger) ${0.80*360}deg,
    #f85149       ${0.80*360}deg, #f85149       360deg
  )`;

  // 警报徽章
  const badge = document.getElementById('alertBadge');
  const cls = 'alert-' + data.alert_level;
  badge.innerHTML = `<span class="alert-badge ${cls}">${data.alert}</span>`;

  // 卡片
  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = '';

  data.indicators.forEach((ind, i) => {
    const score = ind.score;
    const prev  = ind.prev_score || score;
    const diff  = score - prev;
    const history = ind.history || [];

    // 颜色
    let barClass = 'safe';
    if (score >= 80) barClass = 'danger';
    else if (score >= 65) barClass = 'warn';
    else if (score >= 40) barClass = 'normal';

    // 趋势箭头
    let trendHtml = '';
    if (diff > 0) {
      trendHtml = `<span class="trend-up">↑ +${diff}</span>`;
    } else if (diff < 0) {
      trendHtml = `<span class="trend-down">↓ ${diff}</span>`;
    } else {
      trendHtml = `<span class="trend-flat">→ 0</span>`;
    }

    // 折线图
    const sparkHtml = buildSparkline(history, barClass);

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-header">
        <span class="card-title">${i+1}. ${ind.name}</span>
        <span class="card-weight">权重 ${(ind.weight*100).toFixed(0)}% · 加权 ${ind.weighted.toFixed(1)}</span>
      </div>
      <div class="card-body">
        <div class="bar-wrap">
          <div class="bar-bg"><div class="bar-fill ${barClass}" style="width:${score}%"></div></div>
        </div>
        ${sparkHtml}
        <div class="score-cell">
          <div class="score-num">${score}</div>
          <div class="score-change">${trendHtml}</div>
          <div class="raw-tag">${ind.raw_value || ''}</div>
          ${ind.name === 'Shiller CAPE' ? '<div class="cape-reminder">📌 每月手动更新</div>' : ''}
        </div>
      </div>`;
    cardsEl.appendChild(card);
  });
}

function buildSparkline(data, cls) {
  if (!data || data.length < 2) return '';
  const w = 100, h = 36;
  const pad = 2;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;

  const points = data.map((v, i) => {
    const x = pad + (i / (data.length - 1)) * (w - 2 * pad);
    const y = h - pad - ((v - min) / range) * (h - 2 * pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');

  let stroke = '#3fb950';
  if (cls === 'danger') stroke = '#f85149';
  else if (cls === 'warn') stroke = '#d2991d';
  else if (cls === 'normal') stroke = '#58a6ff';

  return `<div class="sparkline-wrap">
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polyline points="${points}" stroke="${stroke}" />
    </svg>
  </div>`;
}
</script>
</body>
</html>
